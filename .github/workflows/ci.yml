name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dev tools
        run: python -m pip install pytest==8.4.2 ruff==0.14.0
      - name: Lint
        run: ruff check .
      - name: Validate JSON manifests
        run: |
          for f in .claude-plugin/plugin.json .claude-plugin/marketplace.json hooks/hooks.json bench/tasks.json; do
            python -m json.tool "$f" > /dev/null
          done
      - name: Test
        run: python -m pytest
      - name: Benchmark fixture passes its own tests
        run: cd bench/fixture && python -m pytest -q
